<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="description" content="Control de ingresos, gastos y topes mensuales por categoría.">
<meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="app-title">Mis finanzas</div>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabbar" aria-label="Secciones">
  <div class="inner">
    <button class="tab" type="button" data-action="tab" data-tab="inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
      Inicio
    </button>
    <button class="tab" type="button" data-action="tab" data-tab="movimientos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>
      Movimientos
    </button>
    <button class="fab" type="button" data-action="add" aria-label="Registrar movimiento">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
    <button class="tab" type="button" data-action="tab" data-tab="topes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"></path></svg>
      Topes
    </button>
    <button class="tab" type="button" data-action="tab" data-tab="ajustes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      Ajustes
    </button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <form id="tx-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="sheet-title">Nuevo movimiento</h2>
      <button class="icon-btn" type="button" data-action="close-sheet" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Tipo">
      <label><input type="radio" name="type" value="gasto" checked><span>Gasto</span></label>
      <label><input type="radio" name="type" value="ingreso"><span>Ingreso</span></label>
    </div>
    <label class="field">Monto
      <span class="money big"><span class="cur" id="sheet-cur">S/</span><input class="input amount-input" id="f-amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span>
    </label>
    <fieldset class="cat-grid" id="f-cats"><legend>Categoría</legend></fieldset>
    <div class="row2">
      <label class="field">Fecha<input class="input" id="f-date" name="date" type="date"></label>
      <label class="field">Nota (opcional)<input class="input" id="f-note" name="note" type="text" maxlength="120" placeholder="Ej. Supermercado"></label>
    </div>
    <label class="field"><span id="f-acc-label">Pagado con</span><select class="select" id="f-acc"></select></label>
    <div class="form-error" id="f-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="f-delete" data-action="delete-tx" hidden>Eliminar movimiento</button>
  </form>
</dialog>

<dialog class="sheet" id="cat-sheet" aria-labelledby="cat-title">
  <form id="cat-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="cat-title">Nueva categoría</h2>
      <button class="icon-btn" type="button" data-action="close-cat" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <label class="field">Nombre<input class="input" id="c-name" type="text" maxlength="24" autocomplete="off" placeholder="Ej. Educación"></label>
    <fieldset class="color-grid" id="c-colors"><legend>Color</legend></fieldset>
    <div class="form-error" id="c-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="c-delete" data-action="delete-cat" hidden>Eliminar categoría</button>
  </form>
</dialog>

<dialog class="sheet" id="account-sheet" aria-labelledby="account-title">
  <form id="account-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="account-title">Nueva cuenta</h2>
      <button class="icon-btn" type="button" data-action="close-account" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Tipo" id="a-kind-row">
      <label><input type="radio" name="akind" value="cuenta" checked><span>Cuenta</span></label>
      <label><input type="radio" name="akind" value="tarjeta"><span>Tarjeta de crédito</span></label>
    </div>
    <label class="field">Nombre<input class="input" id="a-name" type="text" maxlength="40" autocomplete="off" placeholder="Ej. BCP Ahorros"></label>
    <label class="field" id="a-balance-row">Saldo actual
      <span class="money big"><span class="cur cur-dyn">S/</span><input class="input amount-input" id="a-balance" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span>
    </label>
    <label class="field" id="a-debt-row">Deuda actual (lo que debes hoy)
      <span class="money big"><span class="cur cur-dyn">S/</span><input class="input amount-input" id="a-debt" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span>
    </label>
    <label class="field" id="a-limit-row">Línea de crédito (opcional)
      <span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="a-limit" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 5000"></span>
    </label>
    <div class="row2" id="a-days-row">
      <label class="field">Día de cierre<input class="input" id="a-close" type="text" inputmode="numeric" maxlength="2" placeholder="Ej. 20"></label>
      <label class="field">Día de pago<input class="input" id="a-payday" type="text" inputmode="numeric" maxlength="2" placeholder="Ej. 15"></label>
    </div>
    <div class="pay-box" id="a-pay">
      <div class="group-label" style="margin-top:0">Pagar la tarjeta</div>
      <div class="row2">
        <label class="field">Monto<span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="p-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span></label>
        <label class="field">Desde<select class="select" id="p-from"></select></label>
      </div>
      <button class="btn block" type="button" data-action="pay-card">Registrar pago</button>
    </div>
    <div class="form-error" id="a-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="a-delete" data-action="delete-account" hidden>Eliminar cuenta</button>
  </form>
</dialog>

<dialog class="sheet" id="fixed-sheet" aria-labelledby="fixed-title">
  <form id="fixed-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="fixed-title">Nuevo fijo mensual</h2>
      <button class="icon-btn" type="button" data-action="close-fixed" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Tipo">
      <label><input type="radio" name="xtype" value="gasto" checked><span>Gasto</span></label>
      <label><input type="radio" name="xtype" value="ingreso"><span>Ingreso</span></label>
    </div>
    <label class="field">Nombre<input class="input" id="x-name" type="text" maxlength="60" autocomplete="off" placeholder="Ej. Alquiler, Netflix, Sueldo"></label>
    <div class="row2">
      <label class="field">Monto<span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="x-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span></label>
      <label class="field">Día del mes<input class="input" id="x-day" type="text" inputmode="numeric" maxlength="2" placeholder="1 a 31"></label>
    </div>
    <label class="field" id="x-cat-row">Categoría<select class="select" id="x-cat"></select></label>
    <label class="field" id="x-acc-row"><span id="x-acc-label">Pagado con</span><select class="select" id="x-acc"></select></label>
    <div class="form-error" id="x-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="x-delete" data-action="delete-fixed" hidden>Eliminar fijo</button>
  </form>
</dialog>

<dialog class="sheet" id="goal-sheet" aria-labelledby="goal-title">
  <form id="goal-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="goal-title">Nueva meta</h2>
      <button class="icon-btn" type="button" data-action="close-goal" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <label class="field">Nombre<input class="input" id="g-name" type="text" maxlength="60" autocomplete="off" placeholder="Ej. Fondo de emergencia"></label>
    <div class="row2">
      <label class="field">Meta<span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="g-target" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span></label>
      <label class="field">Ya ahorrado<span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="g-saved" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span></label>
    </div>
    <label class="field">Fecha objetivo (opcional)<input class="input" id="g-deadline" type="month"></label>
    <div class="pay-box" id="g-add-box">
      <div class="group-label" style="margin-top:0">Sumar un abono</div>
      <div class="row2">
        <span class="money"><span class="cur cur-dyn">S/</span><input class="input" id="g-add" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Monto del abono"></span>
        <button class="btn" type="button" data-action="goal-add">Sumar</button>
      </div>
    </div>
    <div class="form-error" id="g-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="g-delete" data-action="delete-goal" hidden>Eliminar meta</button>
  </form>
</dialog>

<dialog class="sheet" id="loan-sheet" aria-labelledby="loan-title">
  <form id="loan-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="loan-title">Nuevo préstamo</h2>
      <button class="icon-btn" type="button" data-action="close-loan" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <label class="field">Monto total
      <span class="money big"><span class="cur" id="loan-cur">S/</span><input class="input amount-input" id="l-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></span>
    </label>
    <label class="field">Descripción<input class="input" id="l-desc" type="text" maxlength="80" autocomplete="off" placeholder="Ej. Préstamo a Carlos"></label>
    <label class="check" id="l-paid-row" hidden><input type="checkbox" id="l-paid">Ya me lo devolvieron</label>
    <div class="form-error" id="l-error" role="alert"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn danger block" type="button" id="l-delete" data-action="delete-loan" hidden>Eliminar préstamo</button>
  </form>
</dialog>

<input type="file" id="import-file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
